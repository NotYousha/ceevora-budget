# /etc/nginx/conf.d/ceevora-budget.conf  (UNVERIFIED template: adjust names, test with `nginx -t`)
server {
    listen 80;
    server_name budget.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name budget.example.com;

    ssl_certificate     /etc/letsencrypt/live/budget.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/budget.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 2m;

    # Flutter web build
    root /opt/ceevora-budget/web;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API (uvicorn on loopback only)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location = /health { proxy_pass http://127.0.0.1:8000; allow 10.0.0.0/8; deny all; }
    location /docs { proxy_pass http://127.0.0.1:8000; allow 10.0.0.0/8; deny all; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8000; allow 10.0.0.0/8; deny all; }
}
